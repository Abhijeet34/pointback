name: CI

# Every job a merge depends on lives in this one file, because the `checks`
# aggregate at the bottom can only `needs:` jobs in its own workflow. The branch
# ruleset (.github/rulesets/main.json) requires exactly that one context, so jobs
# here can be added, renamed or path-scoped without touching branch protection.
#
# Linux only, deliberately: macOS and Windows run weekly and on the release path
# in cross-platform.yml. AGENTS.md, "CI runner platforms", states the rule and
# docs/GIT-WORKFLOW.md prices it.
on:
  push:
    branches: [main]
  pull_request:
  # The history does not change between two runs of the secret scan; gitleaks'
  # rule set does. The weekly run is that re-scan, and nothing else here needs it.
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A superseded pull request run is noise. A superseded push run on main is the
  # only record that the merged commit was ever green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, never a tag: a tag can be
# repointed at new code by whoever owns the action. Dependabot's grouped
# github-actions update (.github/dependabot.yml) moves these pins.
jobs:
  check:
    name: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A backstop, never the mechanism. A job that outlives this is reported
    # `cancelled`, which carries no verdict and which the `checks` aggregate can
    # only refuse; the steps below therefore end themselves first. Ten minutes
    # against a run that takes about thirty seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
      # is the mechanism Chrome's own sandbox uses; without this the browser
      # suite dies on "No usable sandbox!". Lifting the confinement keeps that
      # sandbox switched on, where the usual --no-sandbox workaround turns it off.
      - name: Let Chrome's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Resolved, never typed here: `KNOWN_BROWSERS` in test/helpers/cdp.js is the one
      # list of paths this repository knows a browser by, and a matrix column naming a
      # path of its own meant a runner image that moved Chrome could only be found out
      # by a red release. Resolving in a named step rather than letting the suite
      # discover one keeps the loud failure: no browser is this step failing in a
      # second with the candidates printed, never a skip inside a green job.
      #
      # Existence, not `--version`: chrome.exe on Windows has no console to print to and
      # opens a window instead. What a present-but-broken binary does is now the
      # launcher's to report - it distinguishes a browser that would not start from one
      # that started and was not detected, which this step never could.
      - name: Point the browser suite at this runner's Chrome
        run: |
          set -euo pipefail
          # The ${...} below belongs to the JavaScript template literals, not to the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { envPrefix } from "./src/identity.js";
            import { KNOWN_BROWSERS, findBrowser } from "./test/helpers/cdp.js";
            const found = findBrowser();
            if (!found) {
              console.error(`::error::no browser on ${process.env.RUNNER_OS}. Looked for: ${KNOWN_BROWSERS.join(", ")}`);
              process.exit(1);
            }
            console.error(`resolved the browser for ${process.env.RUNNER_OS} to ${found}`);
            console.log(`${envPrefix}BROWSER=${found}`);
          ' >> "$GITHUB_ENV"

      # The suite bounds its own waits, so this budget should never be reached;
      # when it is, a step timeout fails the step and the job reports `failure`,
      # where the job's own timeout reports `cancelled` and says nothing.
      - name: check
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"

      # Whether the only end-to-end coverage ran is not something a reader should
      # have to infer from a green tick, so the suite's own verdict line is lifted
      # out of the log and into the summary - including when the step above failed.
      #
      # And a missing verdict fails the job rather than noting itself. Reporting alone
      # was not enough: on run 33824393013 windows-2025 ran zero tests, because npm
      # hands a script to cmd.exe there and cmd keeps the quotes around the glob, so
      # `node --test` matched no file, printed a 100% coverage report of an empty set
      # and exited 0. The job was green over a suite that never ran.
      - name: Say whether the browser case ran
        if: always()
        run: |
          set -uo pipefail
          rc=0
          verdict=$(grep -m1 '^browser suite' "$RUNNER_TEMP/check.log" 2>/dev/null || true)
          if [ -z "$verdict" ]; then
            verdict="browser suite: NO VERDICT, this platform never reached the suite"
            echo "::error::$verdict" >&2
            rc=1
          fi
          echo "${{ runner.os }} - $verdict" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # The fleet's shared secret scan in gates, taken at @main like every sibling
  # caller: its gitleaks version and the digests of .gitleaks.toml and
  # .githooks/pre-push live there, so a repin reaches this repository with no
  # edit here. gates is public, which is what lets a public caller reach it.
  # The check reports as `secrets / secret scan`; only `checks` is required.
  secrets:
    uses: Abhijeet34/gates/.github/workflows/shared-secret-scan.yml@main

  # GitHub's own action, available here because the repository is public: it is
  # "available for all public repositories, as well as private repositories that
  # have GitHub Code Security or GitHub Advanced Security enabled". It reads the
  # pull request's dependency diff, so it has nothing to say on a push.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # This tree has one runtime dependency and six dev ones, so there is no
          # backlog to grandfather and no reason to start above the floor.
          fail-on-severity: low
          # A dev dependency here is not "not shipped": src/browser/ is served to
          # the reviewer's browser and the tests drive a real one. Scope is not a
          # safety boundary in this repository.
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure

  # The one pull request that runs macOS and Windows, and the reason the rule in
  # AGENTS.md is "a pull request runs Linux runners only" rather than "no pull
  # request runs anything else". Merging the release pull request is what creates
  # the tag and the GitHub release, and until this job existed those were made
  # from a tree no macOS or Windows runner had seen: on run 33822348514 the tag
  # v0.1.0 and its release were created, `cross-platform` then went red, and the
  # release stands to this day with no tarball, no SBOM and no attestation
  # attached. A gate after the tag cannot un-cut the release; this one is before
  # it. Every other pull request skips this job, and pays nothing.
  cross-platform:
    name: cross-platform
    # Same-repository clause: without it a fork could open a pull request from a
    # branch it names release-please--anything and spend the macOS/Windows matrix
    # for free. scripts/approve-release-checks.js narrows on the identical fact.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cross-platform.yml

  # The single required context. Everything above reaches branch protection
  # through this job and nowhere else, so `if: always()` is load-bearing: without
  # it a failed dependency would leave this job skipped, and a skipped required
  # check is not a failing one.
  checks:
    name: checks
    if: always()
    needs: [check, secrets, dependency-review, cross-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          # 'skipped' is accepted only because three jobs above skip themselves by
          # event or by branch: dependency-review off a pull request, check on the
          # schedule, cross-platform off the release pull request. No job here
          # `needs:` another, so nothing else can produce it.
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$result'" >&2; exit 1 ;;
            esac
          done
