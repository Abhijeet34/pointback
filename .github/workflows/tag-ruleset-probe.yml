# TEMPORARY. Removed before this branch merges. It exists to answer one
# question the ruleset JSON cannot: does a v* tag created by GitHub Actions,
# through the same refs API and GITHUB_TOKEN that release-please uses, pass or
# fail the tag ruleset? Runs only when this file itself changes.
name: tag-ruleset-probe

on:
  push:
    paths: [.github/workflows/tag-ruleset-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-ruleset-probe
    steps:
      - name: Create a v* tag the way release automation does
        run: |
          set -x
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
