name: cross-platform

# The macOS and Windows coverage that ci.yml deliberately does not carry.
# AGENTS.md, "CI runner platforms": a pull request runs Linux only, because
# GitHub bills a macOS minute at about 10x a Linux one and a Windows minute at
# about 1.67x against the same allowance. This repository is public, so those
# minutes are currently free (docs/GIT-WORKFLOW.md shows the arithmetic both
# ways); the split still holds, because a three-OS matrix on every push costs
# wall-clock and attention whatever it costs in dollars.
#
# What only these runners can find: the product spawns a detached server, hands
# a URL to the platform's own opener (src/client.js), canonicalises artifact
# paths and writes 0600 state. Those are the four things that differ per OS.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  # Called by release.yml before it publishes, so a release is never cut on
  # evidence from one platform.
  workflow_call:

# No `concurrency` block at all: AGENTS.md forbids cancel-in-progress on a
# scheduled or release workflow, and a superseded weekly run is the only record
# of its own result.

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A backstop the step timeout below should always reach first.
    timeout-minutes: 20
    strategy:
      # One red platform should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            node: "24"
          - os: windows-2025
            node: "24"
          # `engines.node` says ">=24" with no upper bound, and nothing else
          # tests the upper half of that claim. Current Node on Linux is the
          # cheapest leg that can, and it belongs here rather than in ci.yml: a
          # Node release nobody asked for should not redden a pull request.
          - os: ubuntu-24.04
            node: "26"
    defaults:
      run:
        # bash on all three, so one script body works everywhere; the Windows
        # runner's default is pwsh.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Let Chrome's sandbox start
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Resolved, never typed here: `KNOWN_BROWSERS` in test/helpers/cdp.js is the one
      # list of paths this repository knows a browser by, and a matrix column naming a
      # path of its own meant a runner image that moved Chrome could only be found out
      # by a red release. Resolving in a named step rather than letting the suite
      # discover one keeps the loud failure: no browser is this step failing in a
      # second with the candidates printed, never a skip inside a green job.
      #
      # Existence, not `--version`: chrome.exe on Windows has no console to print to and
      # opens a window instead. What a present-but-broken binary does is now the
      # launcher's to report - it distinguishes a browser that would not start from one
      # that started and was not detected, which this step never could.
      - name: Point the browser suite at this runner's Chrome
        run: |
          set -euo pipefail
          # The ${...} below belongs to the JavaScript template literals, not to the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { envPrefix } from "./src/identity.js";
            import { KNOWN_BROWSERS, findBrowser } from "./test/helpers/cdp.js";
            const found = findBrowser();
            if (!found) {
              console.error(`::error::no browser on ${process.env.RUNNER_OS}. Looked for: ${KNOWN_BROWSERS.join(", ")}`);
              process.exit(1);
            }
            console.error(`resolved the browser for ${process.env.RUNNER_OS} to ${found}`);
            console.log(`${envPrefix}BROWSER=${found}`);
          ' >> "$GITHUB_ENV"

      # The same bound as ci.yml, doubled: these runners are slower, and a macOS
      # minute costs about ten Linux ones, so a hang here is the expensive one.
      - name: check
        timeout-minutes: 12
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"

      # ci.yml lifts this line into the summary for its one platform; a release
      # is gated on three, and which of them actually drove a browser is exactly
      # what a green tick does not carry. Named by platform, and `always()` so a
      # leg that died before the suite says that rather than nothing.
      #
      # A missing verdict fails the leg. On run 33824393013 windows-2025 ran zero
      # tests and went green: npm hands a script to cmd.exe there, cmd keeps the
      # quotes around the glob, and `node --test` matched no file. A silently
      # skipped browser case reporting green is worse than a red one.
      - name: Say whether the browser case ran
        if: always()
        run: |
          set -uo pipefail
          rc=0
          verdict=$(grep -m1 '^browser suite' "$RUNNER_TEMP/check.log" 2>/dev/null || true)
          if [ -z "$verdict" ]; then
            verdict="browser suite: NO VERDICT, this platform never reached the suite"
            echo "::error::$verdict" >&2
            rc=1
          fi
          echo "${{ matrix.os }} - $verdict" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
