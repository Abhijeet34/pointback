name: release

# One workflow, one trigger, one signal. A `on: push: tags` workflow was
# rejected: a hand-pushed tag would fire it, and release-please's
# `release_created` output is the only event that means "this tag was created
# for this tree, just now".
on:
  push:
    branches: [main]
  workflow_dispatch:

# No `concurrency` block, for two reasons rather than one. Cancelling a publish
# mid-flight causes real damage (AGENTS.md, "CI runner platforms"), and GitHub
# keeps only one PENDING run per group even when nothing is cancelled in flight:
# a third push evicts the second, and the run it evicts could be the one carrying
# a release. Queueing here would lose a release to save a runner.

permissions:
  contents: read

jobs:
  # release-please does two things on two different events, and only one of them
  # may be gated. Opening the release pull request has to happen on every push to
  # `main`, unconditionally: a gate in front of it would stop the pull request
  # from ever appearing, which is a worse failure than the one being fixed. So the
  # action is split by its own two skip inputs. This half opens and updates the
  # pull request and `skip-github-release` keeps it from tagging anything;
  # `release-tag` at the bottom is the other half, behind the matrix.
  release-pr:
    name: release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A dispatch names a ref, and the workflow that runs is the one on that ref.
    # This says out loud what `on: push` already restricts, so a dispatch aimed at
    # a branch cannot run the release path from a tree nobody merged. Every job
    # below reaches this guard through `needs:`, so it is stated once.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # "if set to true, then do not try to tag releases" - the action's own
          # description of this input, at the SHA pinned above.
          skip-github-release: true

  # The release pull request's CI does not start on its own: release-please opens
  # it with GITHUB_TOKEN, GitHub creates the resulting `pull_request` run in an
  # approval-required state, and it completes as `action_required` with no check
  # runs at all. So the one pull request that carries a release was the one pull
  # request in this repository that nothing checked. This job releases those runs
  # with the same GITHUB_TOKEN, which is what makes a release unattended without
  # storing a credential to make it so; scripts/approve-release-checks.js carries
  # the narrowing, and test/approve-release-checks.test.js demonstrates it.
  release-pr-checks:
    name: release-pr-checks
    needs: release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # For POST /actions/runs/{id}/approve alone. Nothing else here needs it,
      # which is why it is not on the job that holds contents: write.
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Approve the release pull request's parked checks
        run: node scripts/approve-release-checks.js

  # Unconditional, and that is the whole point. This job used to sit behind
  # `release-please` and behind `outputs.created`, which put the three-platform
  # matrix AFTER the tag it was meant to gate: on run 33859541647 the tag v0.1.1
  # and its release were created by the first job, `windows-2025` then failed, and
  # `artifacts` was skipped - the same empty release as v0.1.0, from the run that
  # was merged to prevent it.
  #
  # Asking "is this push a release?" before running the matrix is what would
  # reintroduce it: that answer is release-please's to give, and a second opinion
  # that says no when the truth is yes skips the matrix, skips `release-tag` with
  # it, and drops the release. So there is no second opinion. The matrix runs on
  # every push to `main`, and the tag is on the far side of it.
  #
  # The tree it tests is main's head, which is the tree `release-tag` tags and the
  # tree `artifacts` packs; the preflight there proves that rather than assuming it.
  cross-platform:
    name: cross-platform
    needs: release-pr
    uses: ./.github/workflows/cross-platform.yml

  # The other half of release-please: this one tags and creates the GitHub
  # release, and it cannot start until macOS, Windows and Linux have all passed
  # in this run, on this tree. `skip-github-pull-request` keeps it from opening a
  # second pull request behind `release-pr`'s back. On an ordinary push there is
  # no merged release pull request to release, so it does nothing and says so
  # through `created`.
  release-tag:
    name: release-tag
    needs: [release-pr, cross-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  artifacts:
    name: artifacts
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # actions/attest-build-provenance signs through GitHub's OIDC identity.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          # The preflight resolves the tag object, which a ref-only fetch of the
          # commit would not bring.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Refuses a release that would attach to a tag this run did not create.
      # scripts/release-preflight.js carries the reason; test/release-preflight.test.js
      # demonstrates it refusing.
      - name: Release preflight
        run: node scripts/release-preflight.js --tag "$TAG" --commit "$RELEASE_SHA"

      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          # The filename carries the package name and version; reading it back
          # rather than composing it keeps the product name out of this file.
          filename=$(npm pack --json --ignore-scripts | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0].filename));
          ')
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"

      # GitHub's dependency-graph export, not `npm sbom`: it describes the
      # manifests from the same data the dependency review reads, needs no
      # dependency installed, and cannot disagree with the alerts on the repo.
      - name: Export the SBOM
        run: gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > sbom.spdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Attach both to the release
        run: gh release upload "$TAG" "${{ steps.pack.outputs.tarball }}" sbom.spdx.json --clobber

  # Off until someone deliberately turns it on. The switch is a repository
  # variable, not a secret and not a default: with NPM_PUBLISH_ENABLED unset a
  # release ends at the tag, the GitHub release and its two assets, and this job
  # is visibly skipped rather than silently absent.
  #
  # It holds no repository write token. The OIDC identity that mints the npm
  # credential lives here alone, and everything it publishes was produced and
  # signed by the job above.
  publish:
    name: publish
    needs: [release-tag, artifacts]
    if: needs.release-tag.outputs.created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      # npm's trusted-publishing docs: "Trusted publishing requires npm CLI
      # version 11.5.1 or later". An older npm fails with ENEEDAUTH, which reads
      # like a misconfigured trusted publisher rather than an old client.
      - name: Check npm can do trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) throw new Error("npm 11.5.1+ is required for trusted publishing");
          ' "$(npm --version)"

      # The same three checks as the artifacts job, plus the ones that only
      # matter when a tarball is actually about to leave the machine.
      - name: Release preflight
        run: node scripts/release-preflight.js --tag "$TAG" --commit "$RELEASE_SHA" --publishing

      # Downloading the release asset rather than rebuilding: what npm receives
      # is then byte-for-byte the artifact that was attested and attached above.
      - name: Fetch the attested tarball
        run: gh release download "$TAG" --pattern '*.tgz'

      # No --provenance flag. npm docs: with trusted publishing "npm
      # automatically generates and publishes provenance attestations ... you
      # don't need to add the --provenance flag", and the flag turns a
      # provenance-ineligible publish into a failed release instead of an
      # unattested one.
      - name: Publish
        run: npm publish ./*.tgz --access public
