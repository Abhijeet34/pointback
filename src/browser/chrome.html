<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Review</title>
    <script src="/recover.js"></script>
    <!-- Chromium and Firefox take the SVG, which follows the tab strip's scheme; Safari takes the PNG. -->
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="stylesheet" href="/house/brand.tokens.css" />
    <link rel="stylesheet" href="/house/roles.css" />
    <link rel="stylesheet" href="/house/scales.css" />
    <link rel="stylesheet" href="/house/components.css" />
    <link rel="stylesheet" href="/chrome.css" />
  </head>
  <body>
    <header class="bar">
      <span class="bar-id">
        <span class="brand">
          <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M11 7v4H3M7 7 3 11l4 4" fill="none" stroke-width="2" />
            <circle class="dot" cx="11" cy="4" r="3" />
          </svg>
          <span class="bar-name" id="appName"></span>
        </span>
        <span class="bar-file" id="fileName"></span>
      </span>
      <span class="bar-tools">
        <span class="presence" id="presence" data-state="waiting">
          <span class="presence-dot" aria-hidden="true"></span>
          <span id="presenceText" role="status"></span>
          <span class="presence-since" id="presenceSince"></span>
        </span>
        <!-- The house's text-size setting, its five steps on <html>: one button in the bar opens them
             in a house popover, and radiogroup.js gives the segments their arrow keys. -->
        <button
          class="hw-btn hw-btn--quiet text-size-button"
          id="textSizeButton"
          type="button"
          popovertarget="textSizePanel"
          aria-label="Text size"
        >
          Aa
        </button>
        <div class="hw-popover text-size-panel" id="textSizePanel" popover>
          <p class="hw-label" id="textSizeLabel">Text size</p>
          <span
            class="hw-segmented"
            id="textSize"
            role="radiogroup"
            aria-labelledby="textSizeLabel"
          >
            <button
              type="button"
              role="radio"
              aria-checked="false"
              data-size="s"
              aria-label="Small"
            >
              S
            </button>
            <button
              type="button"
              role="radio"
              aria-checked="true"
              data-size="m"
              aria-label="Medium"
            >
              M
            </button>
            <button
              type="button"
              role="radio"
              aria-checked="false"
              data-size="l"
              aria-label="Large"
            >
              L
            </button>
            <button
              type="button"
              role="radio"
              aria-checked="false"
              data-size="xl"
              aria-label="Extra large"
            >
              XL
            </button>
            <button
              type="button"
              role="radio"
              aria-checked="false"
              data-size="xxl"
              aria-label="Largest"
            >
              XXL
            </button>
          </span>
        </div>
        <label class="hw-switch annotate">
          <input id="annotate" type="checkbox" role="switch" checked aria-keyshortcuts="A" />
          Annotate
        </label>
        <button class="hw-btn" id="end" type="button">End review</button>
      </span>
    </header>
    <main class="mount">
      <iframe id="artifact" title="The page under review" referrerpolicy="no-referrer"></iframe>
      <!-- Over the page while a note is being written, so a press there is the chrome's to see. -->
      <div class="shield" id="shield" hidden></div>
      <div class="cover" id="cover" hidden>
        <p class="cover-text" id="coverText" role="status"></p>
        <button class="hw-btn hw-btn--accent" id="back" type="button"></button>
      </div>
      <!-- The note card lives here, in the chrome, not in the artifact: the reviewer's instruction
           is read from this textarea and never accepted from the page under review. -->
      <form class="hw-popover card" id="card" role="dialog" aria-label="Leave a note" hidden>
        <p class="hw-note-locator card-target" id="cardTarget"></p>
        <textarea
          class="hw-textarea"
          id="cardText"
          placeholder="What should change here?"
          aria-label="Note"
        ></textarea>
        <p class="card-reason" id="cardReason" role="status" hidden></p>
        <div class="card-row">
          <button class="hw-btn hw-btn--quiet" id="cardCancel" type="button">Cancel</button>
          <button class="hw-btn hw-btn--accent" id="cardAdd" type="submit">Add note</button>
        </div>
      </form>
    </main>
    <aside class="margin" aria-label="Notes">
      <div class="margin-body" id="marginBody">
        <div class="notice" id="notice" role="status" hidden>
          <p class="notice-text" id="noticeText"></p>
          <button class="hw-btn hw-btn--sm" id="takeOver" type="button" hidden>
            Take over here
          </button>
        </div>
        <p class="margin-status margin-outside" id="outside"></p>
        <p class="margin-status" id="status" role="status"></p>
        <ol class="marks" id="marks" aria-label="Notes"></ol>
      </div>
      <form class="send" id="sendForm">
        <button
          class="hw-btn hw-btn--accent hw-btn--lg send-button"
          id="send"
          type="submit"
          aria-keyshortcuts="Control+Enter Meta+Enter"
          disabled
        >
          Send to agent
        </button>
      </form>
    </aside>
    <dialog class="hw-dialog" id="endDialog" aria-labelledby="endTitle">
      <form method="dialog" class="dialog-form">
        <h2 class="hw-subheading" id="endTitle">End this review?</h2>
        <p class="hw-small dialog-text" id="endText"></p>
        <div class="hw-dialog-actions">
          <button class="hw-btn hw-btn--quiet" value="cancel" type="submit">Cancel</button>
          <button
            class="hw-btn hw-btn--danger"
            id="endDiscard"
            value="discard"
            type="submit"
            hidden
          >
            Discard and end
          </button>
          <button class="hw-btn hw-btn--accent" id="endGo" value="end" type="submit">End</button>
        </div>
      </form>
    </dialog>
  </body>
  <script src="/house/radiogroup.js" defer></script>
  <script type="module" src="/chrome.js"></script>
</html>
