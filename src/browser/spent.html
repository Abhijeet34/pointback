<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Review ended</title>
    <!-- A reloaded link to a review the daemon no longer holds lands here instead of on the JSON an
         API caller gets. No data-theme, so it follows the system's light or dark. -->
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="stylesheet" href="/house/brand.tokens.css" />
    <link rel="stylesheet" href="/house/roles.css" />
    <link rel="stylesheet" href="/house/scales.css" />
    <link rel="stylesheet" href="/markdown.css" />
  </head>
  <body>
    <main>
      <h1>This review has ended</h1>
      <p>This link belongs to a review that is no longer open, so there is nothing left to show.</p>
      <p>
        To review the file again, ask your agent to open it once more. It will give you a fresh
        link.
      </p>
    </main>
  </body>
</html>
