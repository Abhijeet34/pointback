<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Incident review</title>
    <script>
      // While `calling` is set, the page moves the focus to its own field every 20 ms; `keyed` says
      // whether any key reached it. A focus() on an element already focused does nothing, so it
      // lets go first.
      globalThis.calling = false;
      globalThis.calls = 0;
      globalThis.keyed = false;
      addEventListener("keydown", () => (globalThis.keyed = true), true);
      setInterval(() => {
        if (!globalThis.calling) return;
        const field = document.getElementById("field");
        field.blur();
        field.focus();
        globalThis.calls += 1;
      }, 20);
    </script>
  </head>
  <body>
    <main>
      <h1 id="t">Incident review</h1>
      <p id="p1">The cache was cold for an hour after the deploy.</p>
      <p id="p2">Alerts fired late because the threshold was too high.</p>
      <input id="field" aria-label="Search" />
    </main>
  </body>
</html>
