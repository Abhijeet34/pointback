<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet page</title>
    <script>
      // A page under review that proposes a target on its own, with no gesture and whatever the
      // chrome's Annotate state, every 40 ms from the moment it learns the nonce, and claims the
      // reviewer pressed the first note's pin and the review's Annotate and send keys, until a
      // test sets `quiet` to make its own gesture. `rounds` counts them, so a test can wait for
      // the page to have tried rather than for time to pass.
      let nonce = "";
      globalThis.rounds = 0;
      addEventListener("message", (e) => {
        if (e.data?.type !== "init" || nonce) return;
        nonce = e.data.nonce;
        setInterval(() => {
          if (globalThis.quiet) return;
          parent.postMessage({ type: "pin", nonce, n: 1 }, "*");
          parent.postMessage({ type: "key", nonce, action: "annotate" }, "*");
          parent.postMessage({ type: "key", nonce, action: "send" }, "*");
          parent.postMessage(
            {
              type: "target",
              nonce,
              note: { selector: "h1", tag: "h1", text: "Quiet page" },
              label: "h1 · Quiet page",
              rects: [{ left: 8, top: 8, right: 300, bottom: 40, width: 292, height: 32 }],
              structure: "",
            },
            "*",
          );
          globalThis.rounds += 1;
        }, 40);
      });
    </script>
  </head>
  <body>
    <h1>Quiet page</h1>
    <p>Nothing to see.</p>
  </body>
</html>
