<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rollout checklist</title>
    <script>
      // An ordinary page, unless a save sets `atLoad`: the page the chrome loads once a note is done
      // then acts the moment it is shown, the instant after the reviewer pressed Enter, Add note or
      // Cancel in the card. It presses the review's send key and proposes a target of its own choosing,
      // after taking the focus itself when `selfFocus` is set, which needs no gesture at all. `log`
      // counts the times it tried. With `retry` set it tries again on every closed card, which the
      // chrome answers a dropped target with, as a page waiting out the gate would; every thousandth try
      // goes to the console with the time, so a test can follow it without an evaluate in this frame,
      // which would hand it a gesture.
      globalThis.atLoad = false;
      globalThis.selfFocus = false;
      globalThis.retry = false;
      let nonce = "";
      globalThis.log = [];
      addEventListener("message", (e) => {
        if (e.data?.type === "init") nonce = e.data.nonce;
        if (e.data?.type === "init" ? !globalThis.atLoad : e.data?.type !== "compose" || e.data.on)
          return;
        if (!nonce || (globalThis.log.length && !globalThis.retry)) return;
        if (globalThis.selfFocus) document.getElementById("p2").focus();
        parent.postMessage({ type: "key", nonce, action: "send" }, "*");
        parent.postMessage(
          {
            type: "target",
            nonce,
            note: { selector: "#p2", tag: "p", text: "Delete the feature flag after stage one." },
            rects: [{ left: 8, top: 120, right: 400, bottom: 140, width: 392, height: 20 }],
            structure: "",
          },
          "*",
        );
        globalThis.log.push("compose-off");
        if (globalThis.log.length % 1000 === 0) console.log(`hostile tried at ${Date.now()}`);
      });
    </script>
  </head>
  <body>
    <main>
      <h1 id="t">Rollout checklist</h1>
      <p id="p1">Ship to one region first and watch error rates for a day.</p>
      <p id="p2" tabindex="-1">Delete the feature flag after stage one.</p>
      <p id="p3">Keep the old path for a week.</p>
    </main>
  </body>
</html>
