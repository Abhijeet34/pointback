<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nightly run</title>
    <style>
      body {
        margin: 0;
        background: rgb(13, 15, 16);
        color: rgb(216, 221, 227);
        font:
          16px/1.5 Georgia,
          serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid rgb(42, 47, 51);
        padding: 6px 10px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Nightly run, 2 October</h1>
      <p id="lead">
        Every check passed except one: <mark id="found">two roles under their floor</mark>.
      </p>
      <table id="audit">
        <thead>
          <tr>
            <th>Role</th>
            <th>Measured against the neutral ground</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>house › neutral</th>
            <td id="cell">hue 260, chroma 0.012</td>
          </tr>
        </tbody>
      </table>
      <svg id="chart" width="240" height="80" role="img" aria-label="Throughput by hour">
        <rect x="10" y="20" width="60" height="60" fill="rgb(59, 130, 246)" />
        <rect x="90" y="5" width="60" height="75" fill="rgb(59, 130, 246)" />
      </svg>
      <p id="close">
        The next run starts at two and repeats the audit against the regenerated tokens.
      </p>
    </main>
  </body>
</html>
