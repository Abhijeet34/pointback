<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Usage dashboard</title>
    <style>
      body {
        font: 15px/1.5 system-ui;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #1d2330;
      }
      .card {
        background: #fff;
        border: 1px solid #dde1e8;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        max-width: 720px;
      }
      nav a {
        margin-right: 16px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #b8c0cc;
        background: #fff;
      }
      button.primary {
        background: #2457d6;
        color: #fff;
        border-color: #2457d6;
      }
      label {
        display: block;
        margin: 8px 0 4px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#overview">Overview</a><a href="#billing">Billing</a><a href="#settings">Settings</a>
    </nav>
    <div class="card" id="overview">
      <h1>Usage this month</h1>
      <p>Requests are up 12 percent on last month.</p>
      <svg id="chart" width="640" height="160" role="img" aria-label="Requests per day">
        <rect x="10" y="60" width="40" height="100" fill="#2457d6" />
        <rect x="60" y="40" width="40" height="120" fill="#2457d6" />
        <rect x="110" y="90" width="40" height="70" fill="#2457d6" />
        <rect x="160" y="20" width="40" height="140" fill="#d63a24" />
        <text x="160" y="15" font-size="12">Spike</text>
      </svg>
      <canvas id="heat" width="300" height="60" style="display: block; background: #eef"></canvas>
      <img src="trend.svg" alt="Weekly trend" width="200" height="80" />
    </div>
    <div class="card" id="billing">
      <h2>Billing</h2>
      <label for="plan">Plan</label
      ><select id="plan">
        <option>Starter</option>
        <option>Team</option>
      </select>
      <label for="email">Invoice email</label><input id="email" value="ops@example.com" />
      <p>
        <button class="primary" id="upgrade">Upgrade plan</button>
        <button>Cancel subscription</button>
      </p>
      <p id="outcome">No change made.</p>
      <p>Read the <a href="#terms">terms of service</a> before upgrading.</p>
    </div>
    <script>
      // The page's own handlers, on the element and delegated from the document as a framework does.
      // Each leaves a mark the reviewer can see, so a click that reached the page is not invisible.
      const outcome = document.getElementById("outcome");
      document.getElementById("upgrade").addEventListener("click", () => {
        outcome.textContent = "Plan upgraded.";
        outcome.dataset.ran = (outcome.dataset.ran ?? "") + "element ";
      });
      document.addEventListener("click", (event) => {
        if (event.target.closest("button, a, input, select"))
          outcome.dataset.ran = (outcome.dataset.ran ?? "") + "document ";
      });
      const heat = document.getElementById("heat").getContext("2d");
      heat.fillStyle = "#2457d6";
      heat.fillRect(0, 20, 300, 20);
    </script>
  </body>
</html>
