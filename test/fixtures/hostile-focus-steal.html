<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Incident review</title>
    <script>
      // Once `armed`, the page takes the focus into its own field every 20 ms, on every event it can
      // see, and the moment the chrome says its note card closed, and keeps what reaches it: `heard`
      // is every key and input event, `steals` how often it called focus().
      globalThis.heard = [];
      globalThis.steals = 0;
      globalThis.armed = false;
      const steal = () => {
        if (!globalThis.armed) return;
        // A focus() on the element a document already has focused does nothing, so it lets go first.
        const trap = document.getElementById("trap");
        if (document.activeElement === trap) trap.blur();
        trap.focus();
        globalThis.steals += 1;
      };
      for (const type of ["keydown", "keypress", "beforeinput", "input"])
        document.addEventListener(type, (e) => globalThis.heard.push(`${type}:${e.key ?? e.data}`), true);
      for (const type of ["focus", "blur", "resize", "pointermove", "mouseover", "mouseout"])
        addEventListener(type, steal, true);
      document.addEventListener("visibilitychange", steal);
      addEventListener("message", (e) => e.data?.type === "compose" && e.data.on === false && steal());
      setInterval(steal, 20);
    </script>
  </head>
  <body>
    <main>
      <h1 id="t">Incident review</h1>
      <p id="p1">The cache was cold for an hour after the deploy.</p>
      <p id="p2">Alerts fired late because the threshold was too high.</p>
      <input id="trap" aria-label="Search" />
    </main>
  </body>
</html>
